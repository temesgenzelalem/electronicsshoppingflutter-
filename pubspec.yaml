name: electromart_pro
description: "ElectroMart Pro - Enterprise Electronics Shopping App with Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.4
  firebase_database: ^11.1.5
  firebase_messaging: ^15.1.3
  firebase_dynamic_links: ^6.0.8
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+1
  firebase_remote_config: ^5.1.2
  firebase_app_check: ^0.3.1+1
  cloud_functions: ^5.1.4

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Animations
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  local_auth: ^2.3.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  flutter_local_notifications: ^17.2.3

  # Payments (integrate with Cloud Functions)
  razorpay_flutter: ^1.3.7

  # Places API
  google_places_flutter: ^2.0.8

  # Other
  uuid: ^4.4.2
  http: ^1.2.2
  dio: ^5.7.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
